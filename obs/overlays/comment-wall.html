<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TIKCAST Comment Wall</title>
  <style>
    body { margin:0; width:1920px; height:1080px; background:transparent; font-family:system-ui,sans-serif; }
    .wall {
      position:absolute; right:40px; bottom:40px; width:420px; max-height:520px;
      display:flex; flex-direction:column; gap:10px;
    }
    .comment {
      background:rgba(255,43,138,0.25); border:1px solid rgba(255,43,138,0.5);
      border-radius:10px; padding:12px 16px; color:#fff; font-size:18px;
    }
    .user { color:#ff2b8a; font-weight:700; font-size:14px; }
  </style>
</head>
<body>
  <div class="wall" id="wall"></div>
  <script>
    const samples = [
      { u: '@alex', t: 'This setup is fire 🔥' },
      { u: '@maya', t: 'Switch to gaming scene!' },
      { u: '@lee', t: 'BRB overlay looks clean' },
    ];
    const wall = document.getElementById('wall');
    samples.forEach(c => {
      const el = document.createElement('div');
      el.className = 'comment';
      el.innerHTML = '<div class="user">' + c.u + '</div>' + c.t;
      wall.appendChild(el);
    });
  </script>
</body>
</html>
