<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TIKCAST Poll</title>
  <style>
    body { margin:0; width:1920px; height:1080px; background:transparent; font-family:system-ui,sans-serif; color:#fff; }
    .card {
      position:absolute; left:60px; top:180px; width:480px;
      background:rgba(6,8,11,0.9); border-left:6px solid #00e5ff;
      border-radius:12px; padding:24px;
    }
    h2 { font-size:26px; margin-bottom:16px; }
    .opt { margin:10px 0; background:rgba(255,255,255,0.08); border-radius:8px; padding:12px; }
    .pct { float:right; color:#00e5ff; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="question">What should we play next?</h2>
    <div class="opt">A) Viral clip <span class="pct">62%</span></div>
    <div class="opt">B) DJ set <span class="pct">38%</span></div>
  </div>
</body>
</html>
